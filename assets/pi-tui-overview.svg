<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">pi-tui terminal interface overview</title>
  <desc id="desc">A dark terminal interface showing a blue Pi header, provider and model details, project and Git status, and session usage metrics.</desc>
